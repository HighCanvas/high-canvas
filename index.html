<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>High Canvas — A Club for Wild Ideas and Tidal Days</title>
  <meta name="description" content="High Canvas is a club for wild ideas and tidal days: voyages by sea, purpose-led social missions, and a community for ideas, support, and belonging.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Hero -->
  <header class="hero">
    <div class="hero-inner">
      <img class="hero-logo" src="assets/logo-ship.png" alt="High Canvas ship emblem" width="160" height="100">
      <h1 class="hero-title">High Canvas</h1>
      <span class="rule rule-hero" aria-hidden="true"></span>
      <p class="hero-tagline">A club for wild ideas<br>and tidal days.</p>
    </div>
  </header>

  <!-- Pillars -->
  <main>
    <section class="pillars" aria-label="What the club does">

      <article class="pillar">
        <img class="pillar-icon" src="assets/card-voyages.jpeg" alt="Watercolour mountains above waves" width="180" height="120">
        <h2 class="pillar-title">Voyages</h2>
        <span class="rule rule-pillar" aria-hidden="true"></span>
        <p class="pillar-text">Journeys by sea, wild places, and shared adventure.</p>
      </article>

      <article class="pillar">
        <img class="pillar-icon" src="assets/card-mission.jpeg" alt="Watercolour lighthouse" width="180" height="120">
        <h2 class="pillar-title">Social Mission</h2>
        <span class="rule rule-pillar" aria-hidden="true"></span>
        <p class="pillar-text">Purpose-led projects, access, and meaningful experiences.</p>
      </article>

      <article class="pillar">
        <img class="pillar-icon" src="assets/card-club.jpeg" alt="Watercolour anchor with rope" width="180" height="120">
        <h2 class="pillar-title">The Club</h2>
        <span class="rule rule-pillar" aria-hidden="true"></span>
        <p class="pillar-text">A community for ideas, support, and belonging.</p>
      </article>

    </section>
  </main>

</body>
</html>
